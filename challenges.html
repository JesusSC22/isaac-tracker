<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Challenges</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow-x: hidden; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px 20px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.8rem;
      color: #e94560;
      letter-spacing: 2px;
    }

    .progress-bar-container {
      background: #16213e;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
      height: 14px;
    }

    .progress-bar {
      height: 100%;
      background: #e94560;
      transition: width 0.3s ease;
      border-radius: 10px;
    }

    .progress-label {
      text-align: right;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #e94560;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 20px 0 8px;
      border-bottom: 1px solid #e9456033;
      padding-bottom: 4px;
    }

    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background 0.2s;
      cursor: pointer;
    }

    li:hover { background: #16213e; }

    li.done .label {
      text-decoration: line-through;
      color: #888;
    }

    input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #e94560;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
      position: relative;
    }

    input[type="checkbox"]:checked { background: #e94560; }

    input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: white;
      font-size: 12px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .label { font-size: 0.95rem; }

    .num {
      color: #aaa;
      font-size: 0.85rem;
      min-width: 26px;
    }

    .diff-chip {
      margin-left: auto;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      color: white;
      flex-shrink: 0;
    }

    .diff-chip.facil       { background: #27ae60; }
    .diff-chip.medio       { background: #f39c12; }
    .diff-chip.dificil     { background: #e74c3c; }
    .diff-chip.muy-dificil { background: #8e44ad; }

    .diff-chip.tier-s { background: #ffd700; color: #1a1a2e; }
    .diff-chip.tier-a { background: #e94560; }
    .diff-chip.tier-b { background: #f39c12; }
    .diff-chip.tier-c { background: #3498db; }
    .diff-chip.tier-d { background: #7f8c8d; }

    .tt-diff.tier-s { background: linear-gradient(135deg, #ffd700, #ffb300); color: #1a1a2e; box-shadow: 0 1px 4px rgba(255,215,0,0.35); }
    .tt-diff.tier-a { background: linear-gradient(135deg, #e94560, #c0392b); color: white; }
    .tt-diff.tier-b { background: linear-gradient(135deg, #f39c12, #d35400); color: white; }
    .tt-diff.tier-c { background: linear-gradient(135deg, #3498db, #2874a6); color: white; }
    .tt-diff.tier-d { background: linear-gradient(135deg, #95a5a6, #7f8c8d); color: white; }

    /* ============ PREMIUM TOOLTIP ============ */
    .challenge-tooltip {
      position: fixed;
      width: 440px;
      max-width: calc(100vw - 24px);
      background: linear-gradient(180deg, #1a2040 0%, #0f1325 100%);
      color: #eee;
      border: 1px solid rgba(233, 69, 96, 0.35);
      border-radius: 14px;
      padding: 0;
      font-size: 0.82rem;
      line-height: 1.5;
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.75),
        0 4px 12px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px) scale(0.985);
      transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2), visibility 0.18s;
      z-index: 1000;
      overflow: hidden;
    }

    .challenge-tooltip.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    body.tooltip-locked::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
      z-index: 999;
      pointer-events: auto;
    }
    body.tooltip-locked .challenge-tooltip {
      pointer-events: auto;
      box-shadow:
        0 0 0 2px #f5b73a,
        0 0 24px rgba(245, 183, 58, 0.35),
        0 18px 50px rgba(0, 0, 0, 0.85);
    }

    /* Premium header with gradient strip */
    .tt-card-header {
      position: relative;
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, rgba(233,69,96,0.20) 0%, rgba(233,69,96,0.04) 75%);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .tt-card-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--tt-tier, #e94560) 25%, var(--tt-tier, #e94560) 75%, transparent 100%);
      opacity: 0.85;
    }
    .tt-card-header.tier-s        { --tt-tier: #ffd700; background: linear-gradient(135deg, rgba(255,215,0,0.22), rgba(255,215,0,0.04) 75%); }
    .tt-card-header.tier-a        { --tt-tier: #e94560; background: linear-gradient(135deg, rgba(233,69,96,0.22), rgba(233,69,96,0.04) 75%); }
    .tt-card-header.tier-b        { --tt-tier: #f39c12; background: linear-gradient(135deg, rgba(243,156,18,0.22), rgba(243,156,18,0.04) 75%); }
    .tt-card-header.tier-c        { --tt-tier: #3498db; background: linear-gradient(135deg, rgba(52,152,219,0.22), rgba(52,152,219,0.04) 75%); }
    .tt-card-header.tier-d        { --tt-tier: #95a5a6; background: linear-gradient(135deg, rgba(149,165,166,0.22), rgba(149,165,166,0.04) 75%); }
    .tt-card-header.facil         { --tt-tier: #27ae60; background: linear-gradient(135deg, rgba(39,174,96,0.22), rgba(39,174,96,0.04) 75%); }
    .tt-card-header.medio         { --tt-tier: #f39c12; background: linear-gradient(135deg, rgba(243,156,18,0.22), rgba(243,156,18,0.04) 75%); }
    .tt-card-header.dificil       { --tt-tier: #e74c3c; background: linear-gradient(135deg, rgba(231,76,60,0.22), rgba(231,76,60,0.04) 75%); }
    .tt-card-header.muy-dificil   { --tt-tier: #8e44ad; background: linear-gradient(135deg, rgba(142,68,173,0.22), rgba(142,68,173,0.04) 75%); }

    .tt-head-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .tt-sprite-box {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.06), rgba(0,0,0,0.45) 75%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.35);
    }
    .tt-sprite-box img {
      max-width: 80%;
      max-height: 80%;
      image-rendering: pixelated;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    }

    .tt-head-text {
      flex: 1;
      min-width: 0;
    }

    .challenge-tooltip .tt-title {
      color: #fff;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: block;
      margin-bottom: 4px;
      line-height: 1.2;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .tt-meta {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .tt-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .challenge-tooltip .tt-diff {
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
      display: inline-block;
      margin: 0;
    }

    .tt-diff.facil       { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
    .tt-diff.medio       { background: linear-gradient(135deg, #f39c12, #d35400); color: white; }
    .tt-diff.dificil     { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
    .tt-diff.muy-dificil { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white; }

    /* Body and section blocks */
    .tt-body {
      padding: 12px 14px 4px;
    }

    .tt-block {
      position: relative;
      padding: 9px 11px 9px 13px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.028);
      border-radius: 8px;
      border-left: 3px solid var(--tt-accent, #e94560);
      transition: background 0.15s;
    }
    .tt-block:hover { background: rgba(255,255,255,0.045); }
    .tt-block:last-child { margin-bottom: 0; }

    .tt-block-label {
      font-size: 0.66rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--tt-accent, #e94560);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tt-block-body {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.93);
      line-height: 1.5;
    }
    .tt-block-body b { color: #fff; font-weight: 700; }

    .tt-block-note {
      display: block;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed rgba(255,255,255,0.08);
      font-size: 0.76rem;
      color: rgba(255,255,255,0.7);
      font-style: italic;
    }

    .tt-block.summary  { --tt-accent: #5dade2; }
    .tt-block.unlock   { --tt-accent: #9b59b6; }
    .tt-block.reward   { --tt-accent: #2ecc71; }
    .tt-block.effect   { --tt-accent: #5dade2; }
    .tt-block.type     { --tt-accent: #95a5a6; }
    .tt-block.howto    { --tt-accent: #e94560; }
    .tt-block.order    { --tt-accent: var(--tt-rank, #f5b73a); }
    .tt-block.priority { --tt-accent: #ffd700; }
    .tt-block.reason   { --tt-accent: #e94560; }

    /* Footer */
    .tt-footer {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 10px 14px 12px;
      text-align: center;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.25));
    }

    .tt-wiki-link {
      color: #e94560;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(233,69,96,0.10);
      border: 1px solid rgba(233,69,96,0.28);
      transition: background 0.15s, color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .tt-wiki-link:hover {
      background: rgba(233,69,96,0.25);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(233,69,96,0.25);
    }

    .tt-fallback {
      margin-top: 6px;
      padding: 6px 10px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.55);
      text-align: center;
      font-style: italic;
      background: rgba(255,255,255,0.02);
      border-radius: 6px;
    }

    /* Simple variant for short tooltips (boss/mark headers) */
    .tt-simple {
      padding: 10px 14px;
      font-size: 0.86rem;
      color: rgba(255,255,255,0.95);
      line-height: 1.45;
    }
    .tt-simple b { color: #fff; }

    .reset-btn {
      display: block;
      margin: 30px auto 0;
      padding: 10px 28px;
      background: transparent;
      border: 2px solid #e94560;
      color: #e94560;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .reset-btn:hover {
      background: #e94560;
      color: white;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e9456033;
    }

    .tab {
      flex: 1;
      padding: 10px 14px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: #888;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab:hover { color: #ccc; }

    .tab.active {
      color: #e94560;
      border-bottom-color: #e94560;
    }

    .view { display: none; }
    .view.active { display: block; }

    .tainted-toggle {
      display: block;
      margin: 20px auto 10px;
      padding: 8px 20px;
      background: transparent;
      border: 2px dashed #8e44ad;
      color: #8e44ad;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-family: inherit;
    }

    .tainted-toggle:hover {
      background: #8e44ad;
      color: white;
    }

    /* Character grid */
    #character-grid {
      overflow: hidden;
      margin-bottom: 10px;
      width: calc(100vw - 40px);
      position: relative;
      left: 50%;
      transform: translateX(-50%);
    }

    .char-grid {
      border-collapse: separate;
      border-spacing: 0;
      background: #1f2a44;
      margin: 0 auto;
      width: 100%;
      table-layout: fixed;
    }

    .char-grid th, .char-grid td {
      border: 1px solid #0f1325;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    .char-grid-corner {
      width: 11%;
      height: 6.5vh;
      font-size: clamp(0.55rem, 0.85vw, 0.95rem);
      color: #aaa;
      text-align: center;
      letter-spacing: 0.5px;
      padding: 3px;
      line-height: 1.15;
      background: #16213e;
      font-weight: bold;
    }

    .char-grid-col-header {
      width: 5.35%;
      height: 6.5vh;
      background: #2a3854;
      text-align: center;
      vertical-align: middle;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .char-grid-col-header:hover {
      background: #3a4a6e;
    }
    .char-grid-col-header img {
      max-width: 85%;
      max-height: 90%;
      width: auto;
      height: auto;
      object-fit: contain;
      image-rendering: pixelated;
      vertical-align: middle;
    }
    .char-grid-col-header.locked img {
      opacity: 0.4;
    }
    .char-grid-col-header.locked::after {
      content: "🔒";
      position: absolute;
      right: 2px;
      bottom: 2px;
      font-size: clamp(10px, 0.9vw, 16px);
      pointer-events: none;
      text-shadow: 0 0 2px #000;
    }
    .char-grid-col-header.tier-sep {
      border-left: 2px solid #1a1a2e;
    }

    .char-grid-row-header {
      width: 11%;
      height: 6.8vh;
      background: #16213e;
      vertical-align: middle;
      text-align: center;
      padding: 2px;
      white-space: nowrap;
    }
    .char-grid-row-header img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: 100%;
      object-fit: contain;
      vertical-align: middle;
      image-rendering: pixelated;
    }
    .char-grid-row-header .mark-abbr {
      font-size: clamp(0.7rem, 1vw, 1.1rem);
      color: #ccc;
      vertical-align: middle;
      font-weight: bold;
    }

    .char-grid-cell {
      width: 5.35%;
      height: 6.8vh;
      background: #3a4a6e;
      text-align: center;
      vertical-align: middle;
      cursor: pointer;
      position: relative;
    }
    .char-grid-cell.tier-sep {
      border-left: 2px solid #1a1a2e;
    }
    .char-grid-cell img {
      max-width: 80%;
      max-height: 85%;
      width: auto;
      height: auto;
      object-fit: contain;
      image-rendering: pixelated;
      transition: opacity 0.15s, filter 0.15s;
      vertical-align: middle;
    }
    .char-grid-cell.priority {
      box-shadow: inset 0 0 0 3px #f5b73a, 0 0 4px rgba(245,183,58,0.35);
      background: #4a5a7e;
    }
    .char-grid-cell.done img {
      opacity: 0.28;
      filter: grayscale(0.5);
    }
    .char-grid-cell.empty {
      cursor: default;
      background: #2a3854;
    }
    .char-grid-cell:hover:not(.empty) {
      outline: 2px solid #e94560;
      outline-offset: -2px;
      z-index: 1;
    }
    /* Resaltado de fila y columna al hacer hover sobre una celda */
    .char-grid-cell.row-highlight,
    .char-grid-cell.col-highlight {
      background: #6480c8;
      box-shadow: inset 0 0 0 1px rgba(245,183,58,0.45);
    }
    .char-grid-cell.priority.row-highlight,
    .char-grid-cell.priority.col-highlight {
      background: #7390d8;
    }
    .char-grid-cell.empty.row-highlight,
    .char-grid-cell.empty.col-highlight {
      background: #45598a;
    }
    /* Celda hovereada (intersección): se resalta en color cálido para distinguirla */
    @keyframes hovered-cell-pulse {
      0%, 100% {
        background-color: #b8385e;
        outline-color: #e94560;
      }
      50% {
        background-color: #d44a78;
        outline-color: #ff6f8c;
      }
    }
    @keyframes hovered-cell-pulse-priority {
      0%, 100% {
        background-color: #c94472;
        outline-color: #e94560;
      }
      50% {
        background-color: #e2588a;
        outline-color: #ff6f8c;
      }
    }
    .char-grid-cell.row-highlight.col-highlight:not(.empty) {
      background: #b8385e;
      animation: hovered-cell-pulse 2.4s ease-in-out infinite;
    }
    .char-grid-cell.priority.row-highlight.col-highlight {
      background: #c94472;
      animation: hovered-cell-pulse-priority 2.4s ease-in-out infinite;
    }
    @keyframes hovered-cell-sprite-pulse {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1) drop-shadow(0 0 0 rgba(255,200,210,0));
      }
      50% {
        transform: scale(1.1);
        filter: brightness(1.18) drop-shadow(0 0 4px rgba(255,200,210,0.55));
      }
    }
    .char-grid-cell.row-highlight.col-highlight:not(.empty) img {
      animation: hovered-cell-sprite-pulse 2.4s ease-in-out infinite;
      transform-origin: center center;
    }
    .char-grid-col-header.col-highlight {
      background: #5a72a8;
      box-shadow: inset 0 -4px 0 #f5b73a, inset 0 0 0 1px rgba(245,183,58,0.5);
    }
    .char-grid-row-header.row-highlight {
      background: #2e4d8a;
      box-shadow: inset -4px 0 0 #f5b73a, inset 0 0 0 1px rgba(245,183,58,0.5);
    }
    .char-grid-cell .item-text {
      font-size: clamp(0.5rem, 0.7vw, 0.8rem);
      color: #ddd;
      line-height: 1.05;
      padding: 2px;
      display: inline-block;
      word-break: break-word;
    }
    .char-grid-cell.col-locked::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.20);
      pointer-events: none;
    }

    /* Compact chrome cuando la vista de personajes está activa */
    body:has(#view-characters.active) {
      padding-top: 12px;
      padding-bottom: 12px;
    }
    body:has(#view-characters.active) h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    body:has(#view-characters.active) .tabs {
      margin-bottom: 10px;
    }
    body:has(#view-characters.active) .progress-bar-container {
      height: 8px;
      margin-bottom: 4px;
    }
    body:has(#view-characters.active) .progress-label {
      margin-bottom: 8px;
      font-size: 0.7rem;
    }
    body:has(#view-characters.active) .tainted-toggle {
      margin: 6px auto 4px;
      padding: 5px 16px;
      font-size: 0.78rem;
    }
    body:has(#view-characters.active) .reset-btn {
      margin: 8px auto 0;
      padding: 6px 20px;
      font-size: 0.8rem;
    }

    /* ===== Tracker-locked mode (active only inside IsaacTracker.exe / PyWebView) ===== */
    body.tracker-locked input[type="checkbox"],
    body.tracker-locked .char-grid-cell,
    body.tracker-locked .char-grid-col-header,
    body.tracker-locked li {
      pointer-events: none;
      cursor: default;
    }
    body.tracker-locked .reset-btn,
    body.tracker-locked .tainted-toggle,
    body.tracker-locked .tab {
      pointer-events: auto;
      cursor: pointer;
    }
  </style>
</head>

<div class="container">

  const DIFF_CLASS = {
    "Fácil": "facil",
    "Medio": "medio",
    "Difícil": "dificil",
    "Muy difícil": "muy-dificil",
  };

  const STORAGE_KEY = 'challenges_state';
  const CHAR_STORAGE_KEY = 'characters_state';
  const TAINTED_VISIBLE_KEY = 'tainted_visible';
  const ACTIVE_TAB_KEY = 'active_tab';

  function loadState(key = STORAGE_KEY) {
    try { return JSON.parse(localStorage.getItem(key)) || {}; }
    catch { return {}; }
  }

  function saveState(state, key = STORAGE_KEY) {
    localStorage.setItem(key, JSON.stringify(state));
  }

  function updateProgress(state) {
    const total = challenges.length;
    const done = Object.values(state).filter(Boolean).length;
    const pct = Math.round((done / total) * 100);
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `${done} / ${total} completados (${pct}%)`;
  }

  function updateCharProgress() {
    const state = loadState(CHAR_STORAGE_KEY);
    const grid = document.getElementById('character-grid');
    const taintedMode = grid && grid.dataset.tainted === '1';
    const visible = CHARACTERS.filter(c => c.tainted === taintedMode);
    let unlocked = 0, doneMarks = 0;
    const totalUnlocks = visible.length;
    const totalMarks = visible.length * COMPLETION_MARKS.length;
    visible.forEach(c => {
      if (state[`${c.slug}_unlocked`]) unlocked++;
      COMPLETION_MARKS.forEach(m => {
        if (state[`${c.slug}_mark_${m.id}`]) doneMarks++;
      });
    });
    const totalAll = totalUnlocks + totalMarks;
    const doneAll = unlocked + doneMarks;
    const pct = totalAll ? Math.round((doneAll / totalAll) * 100) : 0;
    document.getElementById('charProgressBar').style.width = pct + '%';
    document.getElementById('charProgressLabel').textContent =
      `${unlocked}/${totalUnlocks} desbloqueados · ${doneMarks}/${totalMarks} marks (${pct}%)`;
  }

  function resetAll(scope) {
    if (scope === 'challenges') {
      if (!confirm('¿Resetear el progreso de desafíos?')) return;
      saveState({}, STORAGE_KEY);
      document.querySelectorAll('#view-challenges input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
        cb.closest('li').classList.remove('done');
      });
      updateProgress({});
    } else if (scope === 'characters') {
      if (!confirm('¿Resetear el progreso de personajes?')) return;
      saveState({}, CHAR_STORAGE_KEY);
      renderCharacterGrid();
    }
  }

  const tooltipEl = document.getElementById('tooltip');
  tooltipEl.addEventListener('mouseenter', () => { cancelHideTooltip(); });
  tooltipEl.addEventListener('mouseleave', () => { hideTooltip(); });
  // Si Ctrl está pulsado, el navegador interpreta Ctrl+Click sobre un <a> como "abrir en nueva pestaña".
  // Lo manejamos explícitamente para garantizar el comportamiento también con el tooltip bloqueado.
  tooltipEl.addEventListener('click', (e) => {
    const link = e.target.closest('a[href]');
    if (!link) return;
    if (e.ctrlKey || _ctrlLocked) {
      e.preventDefault();
      e.stopPropagation();
      window.open(link.href, '_blank', 'noopener,noreferrer');
    }
  }, true);

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showTooltip(c, anchor) {
    if (_ctrlLocked) return;
    const info = CHALLENGE_INFO[c.num];
    if (!info) return;
    const diffClass = DIFF_CLASS[info.dificultad] || '';
    tooltipEl.innerHTML = `
      <div class="tt-card-header ${diffClass}">
        <div class="tt-head-row">

            <div class="tt-meta">Challenge #${c.num}</div>
            <div class="tt-chips">
              <span class="tt-diff ${diffClass}">${escapeHtml(info.dificultad)}</span>
            </div>
          </div>
        </div>
      </div>
      <div class="tt-body">
        <div class="tt-block summary">
          <div class="tt-block-label">📋 Resumen</div>
          <div class="tt-block-body">${escapeHtml(info.resumen)}</div>
        </div>
        <div class="tt-block unlock">
          <div class="tt-block-label">🔓 Cómo se desbloquea</div>
          <div class="tt-block-body">${escapeHtml(info.desbloqueo)}</div>
        </div>
        <div class="tt-block reward">
          <div class="tt-block-label">🏆 Recompensa</div>
          <div class="tt-block-body">${escapeHtml(info.recompensa)}</div>
        </div>
      </div>
    `;
    cancelHideTooltip();
    tooltipEl.classList.add('visible');
    positionTooltip(anchor);
  }

  function positionTooltip(anchor) {
    const rect = anchor.getBoundingClientRect();
    const tt = tooltipEl.getBoundingClientRect();
    const margin = 8;
    let left = rect.right + margin;
    let top = rect.top;
    if (left + tt.width > window.innerWidth - margin) {
      left = rect.left - tt.width - margin;
    }
    if (left < margin) {
      left = margin;
      top = rect.bottom + margin;
    }
    if (top + tt.height > window.innerHeight - margin) {
      top = Math.max(margin, window.innerHeight - tt.height - margin);
    }
    tooltipEl.style.left = left + 'px';
    tooltipEl.style.top = top + 'px';
  }

  let _tooltipHideTimer = null;
  let _ctrlLocked = false;
  function hideTooltip() {
    if (_ctrlLocked) return;
    clearTimeout(_tooltipHideTimer);
    _tooltipHideTimer = setTimeout(() => {
      tooltipEl.classList.remove('visible');
    }, 180);
  }
  function cancelHideTooltip() {
    clearTimeout(_tooltipHideTimer);
  }
  function isTooltipLocked() { return _ctrlLocked; }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Control' && !_ctrlLocked) {
      if (tooltipEl.classList.contains('visible')) {
        _ctrlLocked = true;
        cancelHideTooltip();
        document.body.classList.add('tooltip-locked');
      }
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'Control' && _ctrlLocked) {
      _ctrlLocked = false;
      document.body.classList.remove('tooltip-locked');
    }
  });
  window.addEventListener('blur', () => {
    if (_ctrlLocked) {
      _ctrlLocked = false;
      document.body.classList.remove('tooltip-locked');
    }
  });

  function render() {
    const state = loadState();
    const container = document.getElementById('list');

    // Group by Y (descending) — Y maps to a Tier letter (5=S best, 1=D worst)
    const TIER_LABEL = { 5: 'TIER S', 4: 'TIER A', 3: 'TIER B', 2: 'TIER C', 1: 'TIER D' };
    const groups = {};
    const groupOrder = [];
    challenges.forEach(c => {
      const key = TIER_LABEL[c.y] || `TIER ?`;
      if (!groups[key]) { groups[key] = []; groupOrder.push(key); }
      groups[key].push(c);
    });

    groupOrder.forEach(groupName => {
      const items = groups[groupName];

      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = groupName;
      container.appendChild(title);

      const ul = document.createElement('ul');
      items.forEach(c => {
        const id = `c_${c.num}`;
        const checked = !!state[id];

        const li = document.createElement('li');
        if (checked) li.classList.add('done');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = id;
        cb.checked = checked;

        const label = document.createElement('span');
        label.className = 'label';

        const numSpan = document.createElement('span');
        numSpan.className = 'num';
        numSpan.textContent = `${c.num}.`;

        label.appendChild(numSpan);
        label.appendChild(document.createTextNode(` ${c.name}`));

        const info = CHALLENGE_INFO[c.num];
        const diffChip = document.createElement('span');
        const diffClass = info ? (DIFF_CLASS[info.dificultad] || '') : '';
        diffChip.className = `diff-chip ${diffClass}`;
        diffChip.textContent = info ? info.dificultad : '';

        li.appendChild(cb);
        li.appendChild(label);
        li.appendChild(diffChip);

        li.addEventListener('click', (e) => {
          if (e.target !== cb) cb.checked = !cb.checked;
          const s = loadState();
          s[id] = cb.checked;
          saveState(s);
          li.classList.toggle('done', cb.checked);
          updateProgress(s);
        });

        li.addEventListener('mouseenter', () => showTooltip(c, li));
        li.addEventListener('mouseleave', hideTooltip);

        ul.appendChild(li);
      });
      container.appendChild(ul);
    });

    updateProgress(state);
  }

  function showCharTooltip(c, anchor) {
    if (_ctrlLocked) return;
    const tierLabel = TIER_LABEL_CHAR[c.tier] || '';
    const tierLower = c.tier.toLowerCase();
    const charSprite = c.sprite ? `<div class="tt-sprite-box"><img src="${c.sprite}" alt=""></div>` : '';
    const taintedBadge = c.tainted ? `<span class="tt-diff" style="background:linear-gradient(135deg,#9b59b6,#6c3483); color:white">⚫ TAINTED</span>` : '';
    tooltipEl.innerHTML = `
      <div class="tt-card-header tier-${tierLower}">
        <div class="tt-head-row">
          ${charSprite}
          <div class="tt-head-text">
            <span class="tt-title">${escapeHtml(c.name)}</span>
            <div class="tt-meta">Personaje${c.tainted ? ' · Versión Tainted' : ''}</div>
            <div class="tt-chips">
              <span class="tt-diff tier-${tierLower}">${tierLabel}</span>
              ${taintedBadge}
            </div>
          </div>
        </div>
      </div>
      <div class="tt-body">
        <div class="tt-block unlock">
          <div class="tt-block-label">🔓 Cómo desbloquearlo</div>
          <div class="tt-block-body">${escapeHtml(c.unlock)}</div>
        </div>
        ${c.priority ? `
        <div class="tt-block reason">
          <div class="tt-block-label">💡 Por qué este tier</div>
          <div class="tt-block-body">${escapeHtml(c.priority)}</div>
        </div>` : ''}
      </div>
    `;
    cancelHideTooltip();
    tooltipEl.classList.add('visible');
    positionTooltip(anchor);
  }

  function showSimpleTooltip(text, anchor) {
    if (_ctrlLocked) return;
    tooltipEl.innerHTML = `<div class="tt-simple">${text}</div>`;
    cancelHideTooltip();
    tooltipEl.classList.add('visible');
    positionTooltip(anchor);
  }

  // Devuelve la URL de la página concreta del item en la wiki, o null si no hay página conocida.
  function itemWikiUrl(name) {
    return ITEM_WIKI_URLS[name] || null;
  }

  // Devuelve {label, longLabel, color, bg} para un rank 1..5
  function rankStyle(rank) {
    switch (rank) {
      case 1: return { label: '1º', longLabel: 'Hazlo primero', color: '#27ae60', bg: '#27ae60' };
      case 2: return { label: '2º', longLabel: 'Pronto',        color: '#2ecc71', bg: '#2ecc71' };
      case 3: return { label: '3º', longLabel: 'Medio',         color: '#f39c12', bg: '#f39c12' };
      case 4: return { label: '4º', longLabel: 'Tardío',        color: '#e67e22', bg: '#e67e22' };
      case 5: return { label: '5º', longLabel: 'Déjalo último', color: '#e74c3c', bg: '#e74c3c' };
      default: return null;
    }
  }

  function showCellTooltip(td) {
    if (_ctrlLocked) return;
    const itemName    = td.dataset.itemName;
    const itemSprite  = td.dataset.itemSprite;
    const isPriority  = td.dataset.itemPriority === '1';
    const charName    = td.dataset.charName;
    const charTier    = (td.dataset.charTier || '').toUpperCase();
    const isTainted   = td.dataset.charTainted === '1';
    const markName    = td.dataset.markName;
    const charSlug    = td.dataset.slug;
    const markId      = parseInt(td.dataset.markId, 10);
    if (!itemName) return;

    const info = (typeof ITEM_INFO !== 'undefined' && ITEM_INFO[itemName]) || {};
    const itemType    = info.type || '';
    const itemDesc    = info.description || '';
    const priorityNote = info.priorityNote || '';

    // Estrategia personaje × mark
    const strat = (typeof MARK_STRATEGY !== 'undefined' && MARK_STRATEGY[charSlug] && MARK_STRATEGY[charSlug][markId]) || null;
    const rank  = strat && strat[0] != null ? strat[0] : null;
    const stratNote = strat && strat[1] ? strat[1] : '';
    const rankInfo = rank ? rankStyle(rank) : null;

    const prioChip = isPriority
      ? `<span class="tt-diff tier-s" title="Item destacado, recomendado">⭐ PRIORITARIO</span>`
      : `<span class="tt-diff tier-c" title="Item de relleno o de calidad media/baja">OPCIONAL</span>`;

    const rankChip = rankInfo
      ? `<span class="tt-diff" style="background:linear-gradient(135deg, ${rankInfo.bg}, ${rankInfo.bg}cc); color:white" title="Orden recomendado para este personaje: ${escapeHtml(rankInfo.longLabel)}">🥇 ${escapeHtml(rankInfo.label)}</span>`
      : '';

    const tierChip = charTier
      ? `<span class="tt-diff tier-${charTier.toLowerCase()}">TIER ${charTier}</span>`
      : '';

    const spriteBox = itemSprite
      ? `<div class="tt-sprite-box"><img src="${itemSprite}" alt=""></div>`
      : '';

    const charLabel = isTainted
      ? `<span style="color:#c39bd3; font-weight:600">${escapeHtml(charName)} ⚫</span>`
      : `<span style="color:#fff; font-weight:600">${escapeHtml(charName)}</span>`;

    // Header tier class — uses item priority for accent color
    const headerTierClass = isPriority ? 'tier-s' : 'tier-c';
    const metaParts = [];
    if (itemType) metaParts.push(escapeHtml(itemType));
    metaParts.push('Item');
    const metaText = metaParts.join(' · ');

    let html = `
      <div class="tt-card-header ${headerTierClass}">
        <div class="tt-head-row">
          ${spriteBox}
          <div class="tt-head-text">
            <span class="tt-title">${escapeHtml(itemName)}</span>
            <div class="tt-meta">${metaText}</div>
            <div class="tt-chips">${prioChip}${rankChip}${tierChip}</div>
          </div>
        </div>
      </div>
      <div class="tt-body">`;

    if (itemDesc) {
      html += `
        <div class="tt-block effect">
          <div class="tt-block-label">💫 Efecto</div>
          <div class="tt-block-body">${escapeHtml(itemDesc)}</div>
        </div>`;
    }

    html += `
      <div class="tt-block howto">
        <div class="tt-block-label">🎯 Cómo conseguirlo</div>
        <div class="tt-block-body">Derrota a <b>${escapeHtml(markName)}</b> jugando como ${charLabel}.</div>
      </div>`;

    if (rankInfo) {
      const genericByRank = {
        1: `Recomendado entre los PRIMEROS marks: ${charName} rinde muy bien contra este boss desde el inicio.`,
        2: `Pronto en la lista — accesible con la build base de ${charName}, sin necesidad de items específicos.`,
        3: `Dificultad intermedia: hazlo cuando tengas algo de build montada con ${charName}.`,
        4: `Difícil: déjalo para cuando tengas un buen run o items defensivos farmados.`,
        5: `Déjalo para el final: con ${charName} requiere build específica, paciencia y mucho cuidado.`,
      };
      const orderBody = stratNote || genericByRank[rank] || '';
      html += `
        <div class="tt-block order" style="--tt-rank:${rankInfo.color}">
          <div class="tt-block-label">🥇 Orden para ${escapeHtml(charName)} — ${escapeHtml(rankInfo.label)} (${escapeHtml(rankInfo.longLabel)})</div>
          ${orderBody ? `<div class="tt-block-body">${escapeHtml(orderBody)}</div>` : ''}
        </div>`;
    }

    if (isPriority) {
      const note = priorityNote || 'Item de alto impacto o muy útil en runs.';
      html += `
        <div class="tt-block priority">
          <div class="tt-block-label">⭐ Por qué es prioritario</div>
          <div class="tt-block-body">${escapeHtml(note)}</div>
        </div>`;
    }

    const wikiUrl = itemWikiUrl(itemName);

    if (!itemType && !itemDesc && !wikiUrl) {
      html += `<div class="tt-fallback">ⓘ Sin descripción local ni página de wiki conocida</div>`;
    } else if (!itemType && !itemDesc) {
      html += `<div class="tt-fallback">ⓘ Sin descripción local — abre la wiki para más detalles</div>`;
    }

    html += `</div>`;

    if (wikiUrl) {
      html += `
        <div class="tt-footer">
          <a href="${wikiUrl}" target="_blank" rel="noopener noreferrer" class="tt-wiki-link">🔗 Abrir "${escapeHtml(itemName)}" en la wiki</a>
        </div>`;
    }

    tooltipEl.innerHTML = html;
    cancelHideTooltip();
    tooltipEl.classList.add('visible');
    positionTooltip(td);
  }

  function renderCharacterGrid() {
    const container = document.getElementById('character-grid');
    const taintedMode = container.dataset.tainted === '1';
    const state = loadState(CHAR_STORAGE_KEY);

    const chars = CHARACTERS
      .filter(c => c.tainted === taintedMode)
      .sort((a, b) => TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier));

    const table = document.createElement('table');
    table.className = 'char-grid';

    // Cabecera: esquina + sprites de personajes
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'char-grid-corner';
    corner.textContent = taintedMode ? 'TAINTED CHARACTERS' : 'NORMAL CHARACTERS';
    headRow.appendChild(corner);

    let prevTier = null;
    chars.forEach(c => {
      const th = document.createElement('th');
      th.className = 'char-grid-col-header';
      if (prevTier !== null && c.tier !== prevTier) th.classList.add('tier-sep');
      prevTier = c.tier;

      const img = document.createElement('img');
      img.src = c.sprite;
      img.alt = c.name;
      th.appendChild(img);

      const isUnlocked = !!state[`${c.slug}_unlocked`];
      if (!isUnlocked) th.classList.add('locked');

      th.dataset.slug = c.slug;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    // Filas: una por mark
    const tbody = document.createElement('tbody');
    COMPLETION_MARKS.forEach(m => {
      const tr = document.createElement('tr');
      const rh = document.createElement('td');
      rh.className = 'char-grid-row-header';
      rh.title = m.name;

      if (MARK_BOSS_SPRITES[m.id]) {
        const bossImg = document.createElement('img');
        bossImg.src = MARK_BOSS_SPRITES[m.id];
        bossImg.alt = m.name;
        rh.appendChild(bossImg);
      } else {
        const abbr = document.createElement('span');
        abbr.className = 'mark-abbr';
        abbr.textContent = m.short;
        rh.appendChild(abbr);
      }
      tr.appendChild(rh);

      let prevTier2 = null;
      chars.forEach(c => {
        const td = document.createElement('td');
        td.className = 'char-grid-cell';
        if (prevTier2 !== null && c.tier !== prevTier2) td.classList.add('tier-sep');
        prevTier2 = c.tier;

        const unlocks = (CHARACTER_UNLOCKS[c.slug] || [])[m.id] || null;
        const stateKey = `${c.slug}_mark_${m.id}`;
        const isDone = !!state[stateKey];

        if (unlocks && unlocks.priority) td.classList.add('priority');
        if (isDone) td.classList.add('done');

        if (unlocks && unlocks.sprite) {
          const img = document.createElement('img');
          img.src = unlocks.sprite;
          img.alt = unlocks.name || '';
          td.appendChild(img);
        } else if (unlocks && unlocks.name) {
          const txt = document.createElement('span');
          txt.className = 'item-text';
          txt.textContent = unlocks.name;
          td.appendChild(txt);
        } else {
          td.classList.add('empty');
        }

        if (!state[`${c.slug}_unlocked`]) td.classList.add('col-locked');

        td.dataset.slug = c.slug;
        td.dataset.mark = m.id;
        td.dataset.itemName = unlocks ? (unlocks.name || '') : '';
        td.dataset.itemSprite = unlocks ? (unlocks.sprite || '') : '';
        td.dataset.itemPriority = unlocks && unlocks.priority ? '1' : '0';
        td.dataset.charName = c.name;
        td.dataset.charTier = c.tier || '';
        td.dataset.charTainted = c.tainted ? '1' : '0';
        td.dataset.markName = m.name;
        td.dataset.markId = m.id;

        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    container.innerHTML = '';
    container.appendChild(table);

    attachGridListeners();
    updateCharProgress();
  }

  function attachGridListeners() {
    const grid = document.getElementById('character-grid');

    grid.querySelectorAll('.char-grid-col-header').forEach(th => {
      th.addEventListener('click', () => {
        const slug = th.dataset.slug;
        const s = loadState(CHAR_STORAGE_KEY);
        const key = `${slug}_unlocked`;
        s[key] = !s[key];
        saveState(s, CHAR_STORAGE_KEY);
        th.classList.toggle('locked', !s[key]);
        const colIdx = Array.from(th.parentNode.children).indexOf(th);
        grid.querySelectorAll('tbody tr').forEach(tr => {
          const cell = tr.children[colIdx];
          if (cell) cell.classList.toggle('col-locked', !s[key]);
        });
        updateCharProgress();
      });

      th.addEventListener('mouseenter', () => {
        const c = CHARACTERS.find(x => x.slug === th.dataset.slug);
        if (c) showCharTooltip(c, th);
      });
      th.addEventListener('mouseleave', hideTooltip);
    });

    grid.querySelectorAll('.char-grid-cell').forEach(td => {
      td.addEventListener('click', () => {
        const slug = td.dataset.slug;
        const mark = parseInt(td.dataset.mark, 10);
        const s = loadState(CHAR_STORAGE_KEY);
        const key = `${slug}_mark_${mark}`;
        s[key] = !s[key];
        saveState(s, CHAR_STORAGE_KEY);
        td.classList.toggle('done', s[key]);
        updateCharProgress();
      });

      td.addEventListener('mouseenter', () => {
        highlightRowAndCol(td);
        const itemName = td.dataset.itemName;
        if (!itemName) return;
        showCellTooltip(td);
      });
      td.addEventListener('mouseleave', () => {
        clearRowColHighlight();
        hideTooltip();
      });
    });
  }

  function highlightRowAndCol(td) {
    const tr = td.parentNode;
    const colIdx = Array.from(tr.children).indexOf(td);
    Array.from(tr.children).forEach(cell => cell.classList.add('row-highlight'));
    const grid = document.getElementById('character-grid');
    const headRow = grid.querySelector('thead tr');
    if (headRow && headRow.children[colIdx]) {
      headRow.children[colIdx].classList.add('col-highlight');
    }
    grid.querySelectorAll('tbody tr').forEach(row => {
      if (row.children[colIdx]) row.children[colIdx].classList.add('col-highlight');
    });
  }

  function clearRowColHighlight() {
    const grid = document.getElementById('character-grid');
    grid.querySelectorAll('.row-highlight').forEach(el => el.classList.remove('row-highlight'));
    grid.querySelectorAll('.col-highlight').forEach(el => el.classList.remove('col-highlight'));
  }

  // Tabs
  function switchTab(view) {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.view === view);
    });
    document.querySelectorAll('.view').forEach(v => {
      v.classList.toggle('active', v.id === `view-${view}`);
    });
    localStorage.setItem(ACTIVE_TAB_KEY, view);
    hideTooltip();
  }
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.view));
  });

  // Tainted toggle
  const taintedBtn = document.getElementById('taintedToggle');
  function setTaintedVisible(visible) {
    const grid = document.getElementById('character-grid');
    grid.dataset.tainted = visible ? '1' : '0';
    taintedBtn.textContent = visible ? '🙈 Ocultar Tainted (volver a Normal)' : '👁 Mostrar Tainted';
    localStorage.setItem(TAINTED_VISIBLE_KEY, visible ? '1' : '0');
    renderCharacterGrid();
  }
  taintedBtn.addEventListener('click', () => {
    const grid = document.getElementById('character-grid');
    setTaintedVisible(grid.dataset.tainted !== '1');
  });

  // Init
  render();
  setTaintedVisible(localStorage.getItem(TAINTED_VISIBLE_KEY) === '1');
  const savedTab = localStorage.getItem(ACTIVE_TAB_KEY);
  if (savedTab) switchTab(savedTab);

  // ===== PyWebView bridge (no-op when opened as plain file://) =====
  // applyIsaacState is invoked by IsaacTracker.exe to push save-derived state
  // into localStorage and trigger re-renders. The function is exposed globally
  // so the python side can call it via window.evaluate_js.
  window.applyIsaacState = function(state) {
    // Backup once before the very first sync, so the user can recover their
    // pre-tracker manual marks if they ever want to.
    if (!localStorage.getItem('_pre_tracker_backup')) {
      localStorage.setItem('_pre_tracker_backup', JSON.stringify({
        challenges: localStorage.getItem(STORAGE_KEY),
        characters: localStorage.getItem(CHAR_STORAGE_KEY),
        timestamp: new Date().toISOString(),
      }));
    }
    if (state && state.challenges_state) {
      saveState(state.challenges_state, STORAGE_KEY);
    }
    if (state && state.characters_state) {
      saveState(state.characters_state, CHAR_STORAGE_KEY);
    }
    render();
    renderCharacterGrid();
  };

  // When PyWebView's JS API is ready, lock the UI (read-only mode) and pull
  // the initial state from python. This event NEVER fires in a regular browser,
  // so the standalone file:// experience is unchanged.
  window.addEventListener('pywebviewready', async () => {
    document.body.classList.add('tracker-locked');
    try {
      const initial = await window.pywebview.api.get_initial_state();
      window.applyIsaacState(initial);
    } catch (e) {
      console.error('Failed to load initial Isaac state from python:', e);
    }
  });
</script>
